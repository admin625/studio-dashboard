# Deploy path (verified 2026-07-03): git push to main → Netlify auto-build (npm install +
# `npm run build`) → publish `dist/` + bundle netlify/functions. Continuous deployment is ON
# (repo linked, stop_builds=false). Do NOT deploy the repo ROOT via the "deploy directory" API/MCP
# tool — that uploads source (incl. node_modules) into a pre-built-dir deploy and fails at install.
# For a manual out-of-band publish, use pre-built: `netlify deploy --prod --dir dist --functions netlify/functions`.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."proxy-webhook"]
  timeout = 26

# Ten concurrent vision calls. Each is ~3-5s and they overlap, but the default 10s window is not
# enough headroom for a full batch plus the Supabase read.
[functions."derive-photo-keywords"]
  timeout = 26

# One vision call carrying up to 10 images does not fit in the 10s default. This function was
# blocked on ANTHROPIC_API_KEY, which was set 2026-08-07 — and it would still have timed out.
# Clearing the known blocker did not make it work.
[functions."derive-photo-style"]
  timeout = 26

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
