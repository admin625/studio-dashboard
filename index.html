<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCA Studio Dashboard</title>
    <!-- Served from public/, which Vite copies verbatim, so this URL is stable across
         builds. The previous /assets/logo.png resolved to the SPA fallback (index.html),
         so the favicon never loaded and there was no public logo URL for email templates. -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
    <style>html,body{margin:0;padding:0;background:#0A0B0D;color:#e2e8f0;min-height:100vh;}#root{min-height:100vh;}</style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
